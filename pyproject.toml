[project]
name = "mistral-speech-to-text"
version = "0.2.0"
description = "Local, minimalist push-to-talk speech-to-text for macOS via Mistral Voxtral"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "mistralai>=1.0",
    "httpx>=0.27",
    # truststore fait valider le TLS par le trousseau macOS : indispensable
    # derriere un proxy d'entreprise (Cato/Zscaler) dont le certificat racine
    # est installe dans le Keychain mais pas connu de certifi.
    "truststore>=0.9",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyobjc-framework-ServiceManagement>=10.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
# Outils de packaging de la .app macOS (mode dev uniquement). PyInstaller est
# choisi plutot que py2app car il supporte le Python "standalone" fourni par uv
# (py2app exige un Python framework) et embarque proprement PortAudio
# (sounddevice), pydantic et certifi via ses hooks.
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Les modules du projet sont a la racine ; on l'ajoute au path d'import pour que
# `tests/` puisse faire `import transcribe`, `import config`, etc.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Les modules AppKit/PyObjC exposent des noms non pythoniques (tick_, initWith...)
# et l'app capture volontairement les exceptions larges (annotees # noqa: BLE001).
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# BLE001 (blind-except) est un choix assume et deja annote ligne par ligne.
ignore = ["E501"]
