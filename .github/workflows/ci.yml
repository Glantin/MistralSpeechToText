name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    # macOS runner: the project targets macOS (PyObjC / CoreAudio) and the tests
    # import those modules.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies (incl. dev tools)
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q
